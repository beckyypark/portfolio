baseURL: 'http://beckyypark.github.io/portfolio/'
languageCode: 'en-us'
title: 'Rebecca Park'
theme: 'papermod'
params:
  profileMode:
    enabled: true
    title: "Rebecca Park" # optional default will be site title
    subtitle: "Data Analyst"
    imageUrl: "gradstairs.jpg" # optional
    imageTitle: "gradpic" # optional
    imageWidth: 220 # custom size
    imageHeight: 220 # custom size
    buttons:
      - name: "About Me"
        url: "/portfolio/aboutme/bio"
      - name: "Projects"
        url: "/portfolio/projects/"
  socialIcons: # optional
    - name: "linkedin"
      url: "https://www.linkedin.com/in/beckyypark"
caches:
  images:
    dir: :cacheDir/images
